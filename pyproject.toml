[project]
name = "agent"
version = "0.0.1"
description = "Autonomous crypto trading agent: validated strategies only, hard risk limits"
requires-python = ">=3.12"
# Exact pins; bump deliberately. Versions chosen to be >= 2 weeks old at pin time (2026-10-18).
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "hypothesis==6.165.0",
  "ruff==0.16.10",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m \"not integration\""
markers = [
  "integration: needs network access to exchange hosts (opt-in: -m integration)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pandas.Timedelta", "pd.Timedelta"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
packages = ["agent"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
